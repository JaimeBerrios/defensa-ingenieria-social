name: Validación de la plantilla

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Ejecutar pruebas
        run: python compilar.py --probar
      - name: Revisar enlaces y recursos locales
        run: python -m herramientas.validacion
      - name: Verificar reporte y presentación sin compilar
        run: python compilar.py --con-presentacion --verificar
